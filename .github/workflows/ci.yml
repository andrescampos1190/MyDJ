name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # The vocal-separation model (~65 MB, downloaded on first use).
      - uses: actions/cache@v4
        with:
          path: backend/models
          key: stem-model-kim-vocal-2
      - run: python -m pytest -v
        working-directory: backend
        env:
          MYDJ_REQUIRE_STEMS: "1" # fail, don't skip, if the model can't be had

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Same layout as local dev: playwright.config.js starts backend/venv's python.
      - run: python -m venv backend/venv && backend/venv/bin/pip install -r backend/requirements.txt
      # The vocal-separation model (~65 MB, downloaded on first use).
      - uses: actions/cache@v4
        with:
          path: backend/models
          key: stem-model-kim-vocal-2
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mydj-backend .
      - name: Container serves /api/health and ships ffmpeg + deno
        run: |
          docker run --rm mydj-backend sh -c "ffmpeg -version | head -1 && deno --version | head -1"
          docker run -d --name mydj -p 8000:8000 mydj-backend
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs mydj; exit 1

  # Real YouTube / SoundCloud downloads. Informational: these sites change often and
  # sometimes block CI runners' datacenter IPs, so a red result here isn't always the code.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # Optional repo secret YTDLP_COOKIES (a cookies.txt export) gets past YouTube's
      # bot check on CI runners — the same fix as YTDLP_COOKIES_FILE on Render.
      - name: Use YouTube cookies if configured
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s\n' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi
      - run: python -m pytest -v tests/test_live.py
        working-directory: backend
        env:
          MYDJ_LIVE: "1"
